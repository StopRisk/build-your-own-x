; Проверка инициализации DX-LR30-900M22SP(T0) на плате-адаптере DX-PJ27-V1.2 (Arduino Mega 2560)
; Сборка: pio run -e megaATmega2560            (один модуль)
;         pio run -e megaATmega2560_two        (два модуля, ping-pong)
; Прошивка: pio run -e megaATmega2560 -t upload --upload-port COMxx
[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/jgromes/RadioLib.git@7.8.1

[env:megaATmega2560]

[env:megaATmega2560_two]
build_flags = -DUSE_TWO_MODULES
